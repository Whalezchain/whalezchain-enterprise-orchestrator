name: CodeQL v4 isolated dry-run

on:
  push:
    branches: ["codex/codeql-v4-dry-run-20261111"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"
      - ".github/workflows/codeql-v4-dry-run.yml"
      - "apps/**"
      - "src/**"
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout candidate caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL v4
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
      - name: Analyze candidate source without code-scanning upload
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          upload: never
          output: codeql-results
      - name: Archive SARIF for review
        if: ${{ always() && hashFiles('codeql-results/**/*.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-v4-candidate-${{ github.run_id }}
          path: codeql-results/**/*.sarif
          if-no-files-found: error
          retention-days: 7
