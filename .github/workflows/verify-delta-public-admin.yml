# CI-only independent validation of the PUBLIC DeltaAlpha Admin PR.
# This workflow runs in an ephemeral standard GitHub-hosted runner of this PUBLIC repo.
# No private repository checkout, paid cloud provisioning, deployment or secrets.
name: DeltaAlpha Admin — Cross-Account Verification (No Deploy)

on:
  pull_request:
    paths:
      - ".github/workflows/verify-delta-public-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delta-admin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DELTA_SOURCE_REPO: deltaalpha-trade-pro/delta-public-beta
  DELTA_SOURCE_SHA: cbc448afea2bf9be2d205dd689f4dccc7ed3f756

jobs:
  admin-security-tests:
    name: Admin policy + Tidio signature tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PUBLIC DeltaAlpha PR commit (no credentials persisted)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DELTA_SOURCE_REPO }}
          ref: ${{ env.DELTA_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up clean Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Admin host, role, MFA and Tidio signature denials
        run: npx --no-install tsx --test tests/admin-console-policy.test.ts tests/admin-tidio-relay-boundary.test.ts

  public-next-build:
    name: DeltaAlpha public Next.js build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact PUBLIC DeltaAlpha PR commit (no credentials persisted)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DELTA_SOURCE_REPO }}
          ref: ${{ env.DELTA_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up clean Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build public Next.js app without deployment credentials
        run: npm run build


  privacy-containment:
    name: Public Founder/Mail route containment (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact public privacy PR source
        uses: actions/checkout@v4
        with:
          repository: deltaalpha-trade-pro/delta-public-beta
          ref: e599527b12147100b3a6dceaf949d37dfb03f6a8
          persist-credentials: false
      - name: Check out verified dependency lockfile in temporary subfolder
        uses: actions/checkout@v4
        with:
          repository: deltaalpha-trade-pro/delta-public-beta
          ref: cbc448afea2bf9be2d205dd689f4dccc7ed3f756
          path: lock-source
          persist-credentials: false
      - name: Verify same package manifest, use verified lockfile only for this CI run
        run: |
          cmp package.json lock-source/package.json
          cp lock-source/package-lock.json package-lock.json
          rm -rf lock-source
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run clean install
        run: npm ci --no-audit --no-fund
      - name: Build privacy containment patch
        run: npm run build
      - name: Verify HTTP 404 on private public-site routes
        run: |
          node - <<'NODE'
          const { spawn } = require("node:child_process");
          const http = require("node:http");
          const server = spawn(process.execPath, ["node_modules/next/dist/bin/next", "start", "-p", "4389"], {
            env: { ...process.env, PORT: "4389", NODE_ENV: "production" },
            stdio: "ignore",
          });
          const probe = (path) => new Promise((resolve, reject) => {
            const req = http.get("http://127.0.0.1:4389" + path, (res) => {
              res.resume();
              resolve(res.statusCode);
            });
            req.on("error", reject);
            req.setTimeout(2000, () => req.destroy(new Error("timeout")));
          });
          (async () => {
            try {
              for (let n = 0; n < 20; n++) {
                try { if (await probe("/") === 200) break; } catch {}
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              for (const path of ["/founder-console", "/mail", "/founder", "/internal/founder"]) {
                const code = await probe(path);
                if (code !== 404) throw new Error(path + " returned HTTP " + code + " instead of 404");
                console.log("PRIVATE_PUBLIC_ROUTE_BLOCKED", path, code);
              }
              console.log("PRIVACY_CONTAINMENT_OK");
            } finally { server.kill(); }
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE

  admin-access-jwt-mfa-diagnostic:
    name: Verify strict Admin Access JWT and Runplane identity contract (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact NEW Admin MFA review commit
        uses: actions/checkout@v4
        with:
          repository: deltaalpha-trade-pro/delta-public-beta
          ref: 55c305ab48be0d52bb16fc37ff5514366fd93d5c
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile without executing dependency scripts in ephemeral CI
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible clean install
        run: npm ci --no-audit --no-fund
      - name: Run Administrator, Access-identity and Tidio signature tests
        run: npx --no-install tsx --test tests/admin-console-policy.test.ts tests/admin-tidio-relay-boundary.test.ts tests/admin-cloudflare-access-policy.test.ts
      - name: Build Next.js app with fail-closed defaults
        run: npm run build
      - name: Hash reviewed dependency manifests
        run: sha256sum package.json package-lock.json > lockfile-provenance.sha256
      - name: Archive verified new JWT dependency lockfile for code review
        uses: actions/upload-artifact@v4
        with:
          name: delta-admin-mfa-lockfile-review
          path: |
            package-lock.json
            lockfile-provenance.sha256
          retention-days: 3
          if-no-files-found: error
