name: Mainnet Settlement Tests

on:
  pull_request:
    paths:
      - "apps/whalezchain_orchestrator/**"
      - ".github/workflows/mainnet-settlement-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ".:./apps"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest cryptography fastapi uvicorn httpx2
      - name: Run complete orchestrator correctness suite
        run: pytest -q apps/whalezchain_orchestrator/tests
