name: Reusable API contract tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version supported by the API project.
        required: false
        default: "3.12"
        type: string
      working-directory:
        description: Caller repository directory containing the API project.
        required: true
        type: string
      install-command:
        description: API test dependencies to install; no secrets are passed to this workflow.
        required: true
        type: string
      contract-test-command:
        description: Local API contract/integration test command (no live endpoints or production credentials).
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository and revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify caller checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install API test dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Run local API contract tests
        env:
          CONTRACT_TEST_COMMAND: ${{ inputs.contract-test-command }}
          NO_EXTERNAL_NETWORK: "1"
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: bash -euo pipefail -c "$CONTRACT_TEST_COMMAND"
