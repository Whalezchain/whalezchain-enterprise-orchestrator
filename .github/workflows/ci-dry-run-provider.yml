name: Central CI dry-run (WhalezChain provider)

on:
  push:
    branches:
      - "codex/centralized-ci-dry-run-*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "apps/whalezchain_orchestrator/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain-tests:
    uses: Whalezchain/whalezchain-enterprise-orchestrator/.github/workflows/whalezchain-dry-run.yml@03db559ed1c32cb116e9b53e401e56c42a9a838a
    permissions:
      contents: read

  security:
    uses: Whalezchain/whalezchain-enterprise-orchestrator/.github/workflows/security-scan.yml@03db559ed1c32cb116e9b53e401e56c42a9a838a
    permissions:
      contents: read
    with:
      codeql-languages: "python,actions"

  governance:
    uses: Whalezchain/whalezchain-enterprise-orchestrator/.github/workflows/governance-policy.yml@03db559ed1c32cb116e9b53e401e56c42a9a838a
    permissions:
      contents: read
    with:
      provider-ref: 03db559ed1c32cb116e9b53e401e56c42a9a838a

  evidence:
    uses: Whalezchain/whalezchain-enterprise-orchestrator/.github/workflows/sbom-evidence.yml@03db559ed1c32cb116e9b53e401e56c42a9a838a
    permissions:
      contents: read
    with:
      evidence-label: whalezchain-ci-dry-run

  release-verification:
    needs: [chain-tests, security, governance, evidence]
    uses: Whalezchain/whalezchain-enterprise-orchestrator/.github/workflows/nonproduction-release-verification.yml@03db559ed1c32cb116e9b53e401e56c42a9a838a
    permissions:
      contents: read
    with:
      evidence-label: whalezchain-ci-dry-run
      required-workflow-names: "chain-tests,security,governance,evidence"
