name: Reusable SBOM and run evidence

on:
  workflow_call:
    inputs:
      evidence-label:
        description: Non-sensitive label for the generated dry-run evidence bundle.
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository and revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify caller checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
      - name: Generate CycloneDX SBOM with pinned Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Generate non-production execution metadata
        env:
          EVIDENCE_LABEL: ${{ inputs.evidence-label }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          body = {
              "classification": "non-production-dry-run",
              "label": os.environ["EVIDENCE_LABEL"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
          }
          Path("run-evidence.json").write_text(json.dumps(body, sort_keys=True, indent=2) + "\n")
          print(json.dumps(body, sort_keys=True))
          PY
      - name: Upload SBOM and non-production evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.evidence-label }}-${{ github.run_id }}
          path: |
            sbom.cdx.json
            run-evidence.json
          if-no-files-found: error
          retention-days: 7
