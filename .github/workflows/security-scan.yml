name: Reusable security scanning

on:
  workflow_call:
    inputs:
      codeql-languages:
        description: Comma-separated CodeQL languages. Empty disables CodeQL while filesystem scanning still runs.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  trivy-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository and revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify caller checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Trivy scanned caller $GITHUB_REPOSITORY at $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Run pinned Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Archive Trivy SARIF report
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7

  codeql:
    if: ${{ inputs.codeql-languages != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository and revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify caller checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "CodeQL analyzed caller $GITHUB_REPOSITORY at $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize CodeQL v3
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ inputs.codeql-languages }}
      - name: Analyze caller source with CodeQL v3
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          # Default CodeQL setup rejects advanced-configuration SARIF uploads.
          # Keep this reusable workflow read-only and retain SARIF as an artifact.
          upload: never
          output: codeql-results
          upload-database: false
      - name: Archive CodeQL SARIF report
        if: ${{ always() && hashFiles('codeql-results/**/*.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-results/**/*.sarif
          if-no-files-found: error
          retention-days: 7
