name: Trivy patched action pin regression
on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - .github/workflows/trivy-pin-review.yml
      - tests/test_trivy_action_pin.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned fixed Trivy reference
        run: python3 -m unittest discover -s tests -p 'test_trivy_action_pin.py' -v
