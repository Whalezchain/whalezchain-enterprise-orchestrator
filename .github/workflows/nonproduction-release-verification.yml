name: Reusable non-production release verification

on:
  workflow_call:
    inputs:
      evidence-label:
        description: Label for a temporary verification artifact only.
        required: true
        type: string
      required-workflow-names:
        description: Comma-separated required check labels present in the caller invocation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository and revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source and emit dry-run manifest
        env:
          EVIDENCE_LABEL: ${{ inputs.evidence-label }}
          REQUIRED_WORKFLOW_NAMES: ${{ inputs.required-workflow-names }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          required = [x.strip() for x in os.environ["REQUIRED_WORKFLOW_NAMES"].split(",") if x.strip()]
          if not required or len(required) > 20:
              raise SystemExit("required workflow list must contain 1..20 labels")
          body = {
              "classification": "non-production-verification-only",
              "label": os.environ["EVIDENCE_LABEL"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "required_check_labels": required,
              "deployment_performed": False,
              "production_secrets_requested": False,
              "financial_actions_performed": False,
          }
          Path("nonproduction-release-verification.json").write_text(
              json.dumps(body, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(body, sort_keys=True))
          PY
      - name: Upload non-production manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.evidence-label }}-verification-${{ github.run_id }}
          path: nonproduction-release-verification.json
          if-no-files-found: error
          retention-days: 7
