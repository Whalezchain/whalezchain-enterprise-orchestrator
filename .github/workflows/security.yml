name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday
  workflow_dispatch:
# This candidate changes only CodeQL. Do not dispatch this legacy combined workflow
# until its separate Trivy remediation is reviewed; the isolated CodeQL workflow
# above provides the safe hosted execution path for this branch.

jobs:
  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          upload: never
          output: codeql-results
      - name: Archive CodeQL SARIF report
        if: ${{ always() && hashFiles('codeql-results/**/*.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-results/**/*.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.12.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          scan-ref: .