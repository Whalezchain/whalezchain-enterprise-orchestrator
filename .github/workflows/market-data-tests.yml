name: Market Data Tests

on:
  pull_request:
    paths:
      - "services/realtime/market_data/**"
      - ".github/workflows/market-data-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/realtime/market_data/requirements.txt pytest
      - name: Run market-data tests
        run: pytest -q services/realtime/market_data/test_store.py
