name: Alternative Account Actions Smoke Test

on:
  push:
    branches:
      - diagnostics/actions-smoke-test-20261026

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner starts
        run: |
          echo "WHALEZ_ACTIONS_SMOKE_TEST=STARTED"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
      - name: Confirm command execution
        run: |
          echo "WHALEZ_ACTIONS_SMOKE_TEST=PASS"
          test "$RUNNER_OS" = "Linux"
